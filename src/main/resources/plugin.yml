name: WorldBorder
main: net.tfminecraft.worldborder.WorldBorder
version: ${project.version}
api-version: '1.21.10'
author: Drefvelin

commands:
  worldborder:
    description: WorldBorder admin commands
    usage: /worldborder <reload|debug>
    permission: worldborder.admin

permissions:
  worldborder.admin:
    description: Reload config and run debug commands
    default: op
  worldborder.bypass:
    description: Ignore border damage and warnings
    default: false
